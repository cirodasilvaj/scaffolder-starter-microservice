apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaffolder-starter-microservice
  namespace: apps-demo
  labels:
    app.kubernetes.io/name: scaffolder-starter-microservice
    app.kubernetes.io/instance: scaffolder-starter-microservice-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: backend-api
    app.kubernetes.io/part-of: kube-demo-2026
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/created-by: backstage-scaffolder
    environment: sandbox
    cost-center: devops-platform-cloud
    cloud-provider: aws
    source-project: scaffolder-starter-microservice
    owner: platform-team
    backstage.io/kubernetes-id: scaffolder-starter-microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scaffolder-starter-microservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scaffolder-starter-microservice
        app.kubernetes.io/instance: scaffolder-starter-microservice-prod
        app.kubernetes.io/component: backend-api
        environment: sandbox
        owner: platform-team
        backstage.io/kubernetes-id: scaffolder-starter-microservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        fluentd.io/collect: "true"
        fluentd.io/parser: "json"
        fluentd.io/destination: "loki"
    spec:
      containers:
        - name: scaffolder-starter-microservice
          image: ghcr.io/cirodasilvaj/scaffolder-starter-microservice:latest
          command:
            - gunicorn
            - --bind
            - 0.0.0.0:8080
            - --workers
            - "2"
            - --threads
            - "4"
            - --worker-class
            - gthread
            - --keep-alive
            - "5"
            - app:app
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_NAME
              value: "scaffolder-starter-microservice"
            - name: FLUENTD_HOST
              value: "fluentd.logging.svc.cluster.local"
            - name: FLUENTD_PORT
              value: "24224"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: scaffolder-starter-microservice
  namespace: apps-demo
  labels:
    app.kubernetes.io/name: scaffolder-starter-microservice
    app.kubernetes.io/part-of: kube-demo-2026
    app.kubernetes.io/managed-by: argocd
    environment: sandbox
    cost-center: devops-platform-cloud
    cloud-provider: aws
    owner: platform-team
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: scaffolder-starter-microservice
  ports:
    - name: http
      port: 8080
      targetPort: 8080
