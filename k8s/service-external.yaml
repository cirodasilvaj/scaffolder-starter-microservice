apiVersion: v1
kind: Service
metadata:
  name: scaffolder-starter-microservice-external
  namespace: apps-demo
  labels:
    app.kubernetes.io/name: scaffolder-starter-microservice
    app.kubernetes.io/part-of: kube-demo-2026
    app.kubernetes.io/managed-by: argocd
    environment: sandbox
    cost-center: devops-platform-cloud
    cloud-provider: aws
    owner: platform-team
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:us-east-1:482268323614:certificate/f99944f1-c7c1-419b-a722-6176b8833f0a"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "https"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: "/healthz"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-interval: "15"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-timeout: "5"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: scaffolder-starter-microservice
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: https
      port: 443
      targetPort: 8080
